<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SL Predict: simulação</title>
<style>
:root{--bg:#F4F6FA;--sf:#fff;--bd:#D5DBE7;--tx:#101828;--mu:#556070;--ac:#0369A1;--on:#fff;--ok:#15803D;--wr:#B45309;--er:#B91C1C;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B1020;--sf:#131A2E;--bd:#26304A;--tx:#F1F5F9;--mu:#A3B1C6;--ac:#38BDF8;--on:#04121F;--ok:#4ADE80;--wr:#FBBF24;--er:#F87171}}
:root[data-theme="dark"]{--bg:#0B1020;--sf:#131A2E;--bd:#26304A;--tx:#F1F5F9;--mu:#A3B1C6;--ac:#38BDF8;--on:#04121F;--ok:#4ADE80;--wr:#FBBF24;--er:#F87171}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
button,select,input{font:inherit;color:var(--tx)}
.in{height:40px;padding:0 10px;background:var(--bg);border:1px solid var(--bd);border-radius:8px}
.bt{height:40px;padding:0 16px;border-radius:8px;border:1px solid var(--bd);background:transparent;cursor:pointer}
.bt.p{background:var(--ac);color:var(--on);border:0;font-weight:700}.bt.s{height:32px;padding:0 10px;font-size:13px}.bt:disabled{opacity:.4;cursor:not-allowed}
.bt:focus-visible,.in:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.cd{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:14px}
.g{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.mu{color:var(--mu)}.k{font-size:26px;font-weight:700;line-height:1.1}
.tb{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:720px}th,td{padding:10px 12px;text-align:left;border-top:1px solid var(--bd);white-space:nowrap}th{color:var(--mu);font-weight:500;border:0}
.ch{display:inline-block;padding:1px 9px;border-radius:99px;border:1px solid;font-size:12.5px;font-weight:600}
.Normal{color:var(--ok)}.Atenção{color:var(--wr)}.Crítico{color:var(--er)}.Offline{color:var(--mu)}
main{padding:16px;display:flex;flex-direction:column;gap:14px;max-width:1280px;margin:0 auto}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--bd);background:var(--sf)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tab[aria-pressed=true]{background:var(--ac);color:var(--on);font-weight:700;border:0}
.bar{height:8px;border-radius:4px;background:var(--bd);overflow:hidden}.bar i{display:block;height:100%}
#tt{position:fixed;right:12px;top:calc(12px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:8px;z-index:9;max-width:340px}
#tt div{background:var(--sf);border:1px solid var(--er);border-radius:8px;padding:10px 12px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.tv .tile{padding:18px}.tv .tile .k{font-size:44px}.tv{font-size:18px}
.lg{display:flex;min-height:100vh;flex-wrap:wrap}.lg>div{flex:1 1 380px;padding:40px 28px;display:flex;flex-direction:column;justify-content:center;gap:14px}
.lg form{max-width:400px;width:100%;margin:auto;display:flex;flex-direction:column;gap:12px}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mu)}
h1{font-size:38px;line-height:1.1;margin:0}h2{font-size:17px;margin:0}
@media (max-width:600px){h1{font-size:28px}main{padding:10px}}
</style></head><body>
<div id="tt" aria-live="polite"></div><div id="app"></div>
<script>
const $=q=>document.querySelector(q),f=(n,d=1)=>Number(n).toFixed(d).replace('.',','),pc=(a,b)=>Math.max(a,Math.min(b,0));
const TIPOS={Motores:{b:{t:62,v:1.8,p:3.2,c:14},l:{t:[75,85],v:[4,6],p:[4.5,5.5]},px:'MOT',gw:'GW-01',pr:'Modbus'},Prensas:{b:{t:55,v:2.4,p:8.6,c:32},l:{t:[75,90],v:[4.5,6.5],p:[9.5,11]},px:'PRN',gw:'GW-02',pr:'OPC-UA'},Esteiras:{b:{t:48,v:1.2,p:2,c:7},l:{t:[65,80],v:[3.5,5.5],p:[2.6,3.2]},px:'EST',gw:'GW-03',pr:'MQTT'},Refrigeração:{b:{t:5.2,v:1,p:11.4,c:21},l:{t:[8,12],v:[3,4.5],p:[13,15]},px:'REF',gw:'GW-04',pr:'MQTT'}};
const PN={t:'Temperatura',v:'Vibração',p:'Pressão'},UN={t:'°C',v:'mm/s',p:'bar',c:'kWh'};
const PERF={Operador:{tabs:['dash','alertas','conect'],ack:1},Engenheiro:{tabs:['dash','ia','alertas','relat','conect'],ack:1,os:1},Gestor:{tabs:['dash','alertas','relat']}};
const TN={dash:'Dashboard de Ativos',ia:'Análise Preditiva via IA',alertas:'Alertas Acionáveis',relat:'Relatórios de Eficiência',conect:'Conectividade'};
const USERS={'operador@novatech.com':'Operador','engenheiro@novatech.com':'Engenheiro','gestor@novatech.com':'Gestor'};
let S={u:null,tab:'dash',fa:'Todos',fp:7,fs:'Todos',q:'',pg:0,run:true,sc:1,tv:false,sel:null,fails:0,lock:false,msg:'',al:[],aid:1,res:0,ln:'',cost:{h:18000,e:9500,m:2800},gw:{},assets:[],lat:230,tk:0};
const rnd=(a,b)=>a+Math.random()*(b-a);
function seed(i){let x=(i+3)*9301%49297;return()=>(x=x*9301%49297)/49297}
function mkAssets(){S.assets=[];Object.entries(TIPOS).forEach(([tp,T])=>{for(let i=1;i<=2*S.sc;i++){const a={id:T.px+'-'+String(i).padStart(2,'0'),tp,b:{...T.b},deg:0,h:[],sn:4,i:S.assets.length};if(S.sc==1&&i==2){if(tp=='Motores'){a.b.t=76;a.b.v=4.3;a.deg=1}if(tp=='Prensas')a.b.p=9.9;if(tp=='Esteiras')a.b.v=3.8;if(tp=='Refrigeração')a.b.t=9.8}Object.assign(a,{t:a.b.t,v:a.b.v,p:a.b.p,c:a.b.c});const r=seed(a.i+1);a.mh=[0,1,2,3].map(k=>({d:Math.round(20+k*75+r()*40),tp:['Preditiva','Preventiva','Corretiva','Preventiva'][(a.i+k)%4],ds:['Troca de rolamento','Lubrificação e inspeção','Reparo após falha','Calibração de sensores'][(a.i+k*3)%4],cu:Math.round(1800+r()*7200)}));S.assets.push(a)}});S.gw={};Object.values(TIPOS).forEach(T=>S.gw[T.gw]={off:false,buf:0,sync:0});}
function ev(a){const L=TIPOS[a.tp].l;let rc=0,ra=0,w='t';['t','v','p'].forEach(k=>{const c=a[k]/L[k][1];if(c>rc){rc=c;w=k}ra=Math.max(ra,a[k]/L[k][0])});a.rc=rc;a.w=w;a.risk=Math.min(99,Math.round(100*Math.pow(Math.max(0,(rc-.5)/.5),2)));a.st=rc>=1?'Crítico':ra>=1?'Atenção':'Normal';a.lim=L[w];a.ttf=a.risk>=90?'menos de 4 h':a.risk>=50?'cerca de '+Math.max(4,Math.round((100-a.risk)*1.6))+' h':'mais de 7 dias';a.cf=Math.round(72+Math.min(24,a.risk/4));a.prev=a.st=='Normal'?'Comportamento dentro do padrão histórico.':PN[w]+' acima do padrão ('+f(a[w])+' '+UN[w]+' contra limite de '+f(a.lim[a.st=='Crítico'?1:0])+'). Falha provável em '+a.ttf+'.'}
function tick(){S.tk++;S.assets.forEach(a=>{const g=S.gw[TIPOS[a.tp].gw];if(g.off)return;['t','v','p','c'].forEach(k=>a[k]+=(a.b[k]-a[k])*.08+(Math.random()-.5)*a.b[k]*.02);if(a.deg){a.t+=.9;a.v+=.1;a.p+=a.b.p*.012;a.c+=.1}const o=a.st;ev(a);a.h.push(a.risk);if(a.h.length>40)a.h.shift();if(a.st!='Normal'&&(o!=a.st))alerta(a)});Object.values(S.gw).forEach(g=>{if(g.off)g.buf=Math.min(72,g.buf+.5);else if(g.sync>0&&--g.sync==0)g.buf=0});S.lat+=(180+(S.sc>1?200:0)+rnd(0,60)-S.lat)*.3;paint(true)}
function alerta(a){let x=S.al.find(z=>z.id==a.id&&z.es!='Resolvido');const l=rnd(.6,1.9);if(x){if(x.sev=='Atenção'&&a.st=='Crítico'){x.sev='Crítico';x.pr=PN[a.w];x.val=f(a[a.w])+' '+UN[a.w];x.lim=f(a.lim[1])+' '+UN[a.w];x.l=l}else return}else S.al.unshift({n:S.aid++,ts:new Date(),id:a.id,tp:a.tp,sev:a.st,pr:PN[a.w],val:f(a[a.w])+' '+UN[a.w],lim:f(a.lim[a.st=='Crítico'?1:0])+' '+UN[a.w],es:'Novo',l});toast(a)}
function toast(a){const d=document.createElement('div');d.innerHTML='<b></b><div class="mu" style="border:0;padding:0;box-shadow:none;background:none"></div>';d.firstChild.textContent=a.st+': '+a.id;d.lastChild.textContent='Notificação enviada à equipe de manutenção por SMS, e-mail e app.';$('#tt').prepend(d);setTimeout(()=>d.remove(),6000)}
function seedAl(){[[2,'MOT-01','Motores','Atenção','Vibração'],[5,'PRN-02','Prensas','Crítico','Pressão'],[12,'REF-02','Refrigeração','Atenção','Temperatura'],[25,'EST-02','Esteiras','Crítico','Vibração']].forEach(([d,id,tp,sev,pr],i)=>S.al.push({n:-i-1,ts:new Date(Date.now()-d*864e5),id,tp,sev,pr,val:'—',lim:'—',es:'Resolvido',l:1.1+i/10,h:1}))}
const chip=s=>`<span class="ch ${s}">${s}</span>`;
function spark(h,w=84,ht=24){if(h.length<2)return'';const p=h.map((v,i)=>(i/(h.length-1)*w).toFixed(1)+','+(ht-2-v/100*(ht-4)).toFixed(1)).join(' ');return`<svg width="${w}" height="${ht}" aria-hidden="true"><polyline points="${p}" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>`}
function filt(){return S.assets.filter(a=>(S.fa=='Todos'||a.tp==S.fa)&&(S.fs=='Todos'||a.st==S.fs)&&(!S.q||a.id.toLowerCase().includes(S.q.toLowerCase())))}
const off=a=>S.gw[TIPOS[a.tp].gw].off;
function page(r){const n=Math.ceil(r.length/10)||1;S.pg=Math.min(S.pg,n-1);return{rows:r.slice(S.pg*10,S.pg*10+10),pg:r.length>10?`<div class="row"><button class="bt s" data-a="pg" data-v="-1">Anterior</button><span class="mu">Página ${S.pg+1} de ${n} · ${r.length} ativos</span><button class="bt s" data-a="pg" data-v="1">Próxima</button></div>`:''}}
function vDash(){const A=S.assets,n=A.length,ok=A.filter(a=>a.st=='Normal').length,at=A.filter(a=>a.st=='Atenção').length,cr=A.filter(a=>a.st=='Crítico').length,ab=S.al.filter(a=>a.es!='Resolvido').length;const K=(l,v,c='')=>`<div class="cd"><div class="mu">${l}</div><div class="k ${c}">${v}</div></div>`;
let h='<div class="g">'+K('Saúde da planta',f(ok/n*100,0)+'%')+K('Em atenção',at,'Atenção')+K('Críticos',cr,'Crítico')+K('Alertas abertos',ab)+K('Disponibilidade (30 dias)',f(99.97-cr*.03-at*.005,2)+'%')+K('MTBF / MTTR',f(412-cr*18,0)+' h / '+f(3.4+cr*.4)+' h')+'</div><div class="g">';
Object.keys(TIPOS).forEach(tp=>{const L=A.filter(a=>a.tp==tp),m=k=>f(L.reduce((s,a)=>s+a[k],0)/L.length),w=L.some(a=>a.st=='Crítico')?'Crítico':L.some(a=>a.st=='Atenção')?'Atenção':'Normal';h+=`<div class="cd"><div class="row" style="justify-content:space-between"><b>${tp}</b>${chip(w)}</div><div class="mu">${L.length} ativos · média: ${m('t')} °C · ${m('v')} mm/s · ${m('p')} bar · ${m('c')} kWh</div></div>`});
const P=page(filt());h+=`</div><div class="cd tb"><table><thead><tr><th>Ativo</th><th>Temp.</th><th>Vibração</th><th>Pressão</th><th>Consumo</th><th>Risco (tendência)</th><th>Saúde</th><th>Manutenção</th></tr></thead><tbody>`+P.rows.map(a=>{const o=off(a),e=o?'Offline':a.st;return`<tr><td><b>${a.id}</b> <span class="mu">${a.tp}</span></td><td>${f(a.t)} °C</td><td>${f(a.v)} mm/s</td><td>${f(a.p)} bar</td><td>${f(a.c)} kWh</td><td class="${a.st}">${spark(a.h)}</td><td>${chip(e)}${o?'<div class="mu" style="font-size:12px">dados em buffer</div>':''}</td><td><button class="bt s" data-a="sel" data-v="${a.id}">Histórico</button></td></tr>`}).join('')+'</tbody></table>'+(P.rows.length?'':'<p class="mu" style="padding:14px">Nenhum ativo com esses filtros.</p>')+'</div>'+P.pg;
const s=A.find(a=>a.id==S.sel);if(s)h+=`<div class="cd"><div class="row" style="justify-content:space-between"><h2>Histórico de manutenções: ${s.id}</h2><button class="bt s" data-a="sel" data-v="">Fechar</button></div><div class="tb"><table><thead><tr><th>Data</th><th>Tipo</th><th>Serviço</th><th>Custo</th></tr></thead><tbody>${s.mh.map(m=>`<tr><td>${new Date(Date.now()-m.d*864e5).toLocaleDateString('pt-BR')}</td><td>${m.tp}</td><td>${m.ds}</td><td>R$ ${m.cu.toLocaleString('pt-BR')}</td></tr>`).join('')}</tbody></table></div></div>`;return h}
function vIa(){const P=page(filt());return'<div class="g g2">'+P.rows.map(a=>{const c=`var(--${a.st=='Normal'?'ok':a.st=='Atenção'?'wr':'er'})`;return`<div class="cd"><div class="row" style="justify-content:space-between"><b>${a.id} <span class="mu">${a.tp}</span></b>${chip(a.st)}</div><div class="mu">Risco de falha previsto: ${a.risk}% · confiança ${a.cf}%</div><div class="bar"><i style="width:${a.risk}%;background:${c}"></i></div><div>${a.prev}</div><div class="mu">Tempo estimado até a falha: ${a.ttf} · maior desvio: ${PN[a.w]}</div></div>`}).join('')+'</div>'+P.pg}
function vAl(){const D=S.fp*864e5,L=S.al.filter(a=>(S.fa=='Todos'||a.tp==S.fa)&&Date.now()-a.ts<=D),op=L.filter(a=>a.es!='Resolvido'),pf=PERF[S.u];const B=a=>{let b='';if(a.es=='Novo'&&pf.ack)b+=`<button class="bt s" data-a="al" data-v="${a.n}:Reconhecido">Reconhecer</button>`;if(a.es!='OS criada'&&pf.os)b+=`<button class="bt s" data-a="al" data-v="${a.n}:OS criada">Criar ordem de serviço</button>`;if(a.es=='OS criada'&&pf.os)b+=`<button class="bt s p" data-a="al" data-v="${a.n}:Resolvido">Concluir intervenção</button>`;return b||'<span class="mu">Somente leitura</span>'};
return`<h2>Abertos (${op.length})</h2>`+(op.map(a=>`<div class="cd row" style="justify-content:space-between"><div style="flex:1 1 320px"><b>${a.id}</b> <span class="mu">${a.tp}</span> ${chip(a.sev)}<div>${a.pr}: ${a.val} (limite ${a.lim})</div><div class="mu">${a.ts.toLocaleString('pt-BR')} · gerado ${f(a.l)} s após o desvio · notificado: SMS, e-mail, app · estado: <b>${a.es}</b></div></div><div class="row">${B(a)}</div></div>`).join('')||'<div class="cd mu">Nenhum alerta aberto com esses filtros.</div>')+`<h2>Histórico dos últimos ${S.fp} dias</h2><div class="cd tb"><table><thead><tr><th>Data</th><th>Ativo</th><th>Gravidade</th><th>Parâmetro</th><th>Estado</th></tr></thead><tbody>${L.filter(a=>a.es=='Resolvido').map(a=>`<tr><td>${a.ts.toLocaleString('pt-BR')}</td><td>${a.id}</td><td>${chip(a.sev)}</td><td>${a.pr}</td><td>${a.es}</td></tr>`).join('')}</tbody></table></div>`}
function econ(){const D=S.fp,n=Math.round(D*.15)+S.res,m=Math.round(D*1.4),C=S.cost,r=[['Paradas não planejadas evitadas',n,'un',n*6.5*C.h/n||0],['Horas de produção preservadas',f(n*6.5),'h',0],['Manutenções emergenciais evitadas',n,'un',n*C.e],['Manutenções fixas desnecessárias evitadas',m,'un',m*C.m]];r[0][3]=n*6.5*C.h;return{r,tot:r[0][3]+r[2][3]+r[3][3],n}}
function vRel(){const E=econ(),R=v=>'R$ '+Math.round(v).toLocaleString('pt-BR');return`<div class="cd row"><label>Custo da hora parada (R$)<input class="in" id="c1" type="number" value="${S.cost.h}"></label><label>Custo extra da emergência (R$)<input class="in" id="c2" type="number" value="${S.cost.e}"></label><label>Custo de uma manutenção fixa (R$)<input class="in" id="c3" type="number" value="${S.cost.m}"></label><button class="bt p" data-a="exp" style="margin-left:auto">Exportar relatório (CSV)</button></div><div class="cd tb"><h2>Impacto da manutenção fixa para a preditiva · últimos ${S.fp} dias</h2><table><thead><tr><th>Indicador</th><th>Quantidade</th><th>Economia</th></tr></thead><tbody>${E.r.map(x=>`<tr><td>${x[0]}</td><td>${x[1]} ${x[2]}</td><td>${x[3]?R(x[3]):'—'}</td></tr>`).join('')}<tr><td><b>Economia total estimada</b></td><td></td><td><b>${R(E.tot)}</b></td></tr></tbody></table><p class="mu">Inclui ${S.res} intervenção(ões) concluída(s) nesta sessão. Valores simulados; ajuste os custos para a realidade da NovaTech.</p></div>`}
function vCon(){const g=Object.entries(TIPOS).map(([tp,T])=>{const G=S.gw[T.gw],n=S.assets.filter(a=>a.tp==tp).length,st=G.off?'Offline':G.sync?'Atenção':'Normal';return`<tr><td><b>${T.gw}</b> <span class="mu">${tp}</span></td><td>${T.pr}</td><td>${n*4}</td><td>${chip(st)} ${G.sync?'sincronizando leituras…':''}</td><td>${f(G.buf)} h de 72 h</td><td>${G.off?'—':f(S.lat,0)+' ms'}</td><td><button class="bt s" data-a="gw" data-v="${T.gw}">${G.off?'Reconectar':'Simular queda'}</button></td></tr>`}).join('');return`<div class="g"><div class="cd"><div class="mu">Sensores conectados</div><div class="k">${S.assets.length*4}</div></div><div class="cd"><div class="mu">Latência de ingestão (meta 500 ms)</div><div class="k">${f(S.lat,0)} ms</div></div><div class="cd"><div class="mu">Alerta após detecção (meta 2 s)</div><div class="k">${f(S.al[0]?S.al[0].l:1.2)} s</div></div><div class="cd"><div class="mu">Escala</div><div class="k">${S.sc>1?'+500%':'base'}</div></div></div><div class="cd tb"><table><thead><tr><th>Gateway de borda</th><th>Protocolo</th><th>Sensores</th><th>Status</th><th>Buffer local</th><th>Latência</th><th></th></tr></thead><tbody>${g}</tbody></table></div><div class="cd mu">Telemetria trafega por TLS 1.3 e fica armazenada com AES-256. Sem conexão, o gateway guarda até 72 h e sincroniza ao reconectar.</div>`}
function vTv(){return'<div class="g">'+S.assets.slice(0,24).map(a=>`<div class="cd tile ${a.st}" style="border-color:currentColor"><div><b>${a.id}</b> ${off(a)?'· offline':''}</div><div class="k">${a.risk}%</div><div style="color:var(--tx)">${f(a.t)} °C · ${f(a.v)} mm/s · ${f(a.p)} bar</div><div>${a.st}</div></div>`).join('')+'</div>'}
const V={dash:vDash,ia:vIa,alertas:vAl,relat:vRel,conect:vCon};
function opt(a,v){return a.map(x=>`<option${String(x)==String(v)?' selected':''}>${x}</option>`).join('')}
function shell(){const A=document.getElementById('app');if(!S.u){A.innerHTML=`<div class="lg"><div style="background:var(--sf)"><b style="font-size:24px">SL Predict</b><h1>Antecipar a falha antes que ela pare a produção.</h1><p class="mu">Plataforma de manutenção preditiva da Solution Lab para a NovaTech. Simulação com dados fictícios.</p></div><div><form id="lf" class="cd" style="padding:26px"><h2>Acessar a plataforma</h2><label>E-mail<input class="in" id="em" autocomplete="username" placeholder="nome@novatech.com"></label><label>Senha<input class="in" id="pw" type="password" autocomplete="current-password"></label><label>Código de verificação (MFA)<input class="in" id="mf" inputmode="numeric" placeholder="00000"></label><div role="alert" class="Crítico">${S.msg}</div><button class="bt p" ${S.lock?'disabled':''}>Entrar</button>${S.lock?'<button type="button" class="bt" data-a="unl">Desbloquear acesso (demonstração)</button>':''}<div class="mu" style="font-size:13px">Contas de teste: operador@, engenheiro@ ou gestor@novatech.com. Senha senha123, MFA 54321. Após 3 falhas o acesso é bloqueado.</div></form></div></div>`;return}
const tabs=PERF[S.u].tabs;if(S.tv){A.className='tv';A.innerHTML='<header><b>SL Predict · painel da planta</b><span id="hs"></span><button class="bt" data-a="tv">Sair do modo TV</button></header><main id="vw"></main>';return}A.className='';
A.innerHTML=`<header><b style="font-size:19px">SL Predict</b><span id="hs" class="mu"></span><span class="row"><span class="mu">${S.u}</span><button class="bt s" data-a="out">Sair</button></span></header><main><div class="row">${tabs.map(t=>`<button class="bt tab" aria-pressed="${S.tab==t}" data-a="tab" data-v="${t}">${TN[t]}</button>`).join('')}</div><div class="cd row"><label>Ativo<select class="in" id="fa">${opt(['Todos',...Object.keys(TIPOS)],S.fa)}</select></label><label>Período<select class="in" id="fp"><option value="7"${S.fp==7?' selected':''}>Últimos 7 dias</option><option value="30"${S.fp==30?' selected':''}>Últimos 30 dias</option></select></label><label>Status de saúde<select class="in" id="fs">${opt(['Todos','Normal','Atenção','Crítico'],S.fs)}</select></label><label>Buscar ativo<input class="in" id="q" value="${S.q}" placeholder="MOT-02"></label></div><details class="cd" open><summary><b>Painel de simulação</b> <span class="mu">controla só a demonstração</span></summary><div class="row" style="margin-top:10px"><button class="bt" data-a="run" id="brun"></button><button class="bt" data-a="fail">Simular falha em um ativo</button><button class="bt" data-a="sc" id="bsc"></button><button class="bt" data-a="tv">Modo painel / TV</button></div></details><div id="vw"></div><div class="mu">Dados simulados para demonstração.</div></main>`}
function paint(soft){if(!S.u)return;const hs=$('#hs');if(hs)hs.textContent=`● Operacional · disponibilidade 99,97% · ingestão ${f(S.lat,0)} ms · ${new Date().toLocaleTimeString('pt-BR')}`;if(!$('#vw'))return shell(),paint();if(soft&&S.tab=='relat'&&!S.tv)return;const b=$('#brun');if(b)b.textContent=S.run?'Pausar simulação':'Retomar simulação';const c=$('#bsc');if(c)c.textContent=S.sc>1?'Voltar à escala base':'Escalar sensores em +500%';$('#vw').innerHTML=S.tv?vTv():V[S.tab]()}
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a,v=t.dataset.v;if(a=='tab'){S.tab=v;S.pg=0;shell();paint()}else if(a=='pg'){S.pg=Math.max(0,S.pg+ +v);paint()}else if(a=='sel'){S.sel=v;paint()}else if(a=='out'){S.u=null;S.msg='Sessão encerrada.';shell()}else if(a=='unl'){S.lock=false;S.fails=0;S.msg='Acesso desbloqueado (demonstração).';shell()}
else if(a=='run'){S.run=!S.run;paint()}else if(a=='fail'){const c=S.assets.filter(x=>!x.deg&&!off(x)),x=c[Math.floor(Math.random()*c.length)];if(x){x.deg=1;toast({st:'Falha simulada',id:x.id})}}
else if(a=='sc'){S.sc=S.sc>1?1:6;S.pg=0;mkAssets();S.assets.forEach(ev);paint()}else if(a=='tv'){S.tv=!S.tv;document.documentElement.dataset.theme=S.tv?'dark':'';if(!S.tv)delete document.documentElement.dataset.theme;shell();paint()}
else if(a=='gw'){const g=S.gw[v];if(g.off){g.off=false;g.sync=4}else{g.off=true;g.buf=0}paint()}
else if(a=='al'){const[n,es]=v.split(':'),x=S.al.find(z=>z.n==n);if(x){x.es=es;if(es=='Resolvido'){const s=S.assets.find(z=>z.id==x.id);if(s){s.deg=0;Object.assign(s,{t:s.b.t,v:s.b.v,p:s.b.p,c:s.b.c});s.mh.unshift({d:0,tp:'Preditiva',ds:'Intervenção planejada após alerta',cu:3200});ev(s)}S.res++}}paint()}
else if(a=='exp'){const E=econ(),csv=['Indicador;Quantidade;Economia (R$)',...E.r.map(x=>x[0]+';'+x[1]+';'+Math.round(x[3])),'Economia total estimada;;'+Math.round(E.tot)].join('\n');(async()=>{try{const d=await claude.use('downloads');if(!d)throw 0;await d.save({filename:'relatorio_eficiencia_sl_predict.csv',data:csv})}catch(_){toast({st:'Exportação indisponível',id:'neste ambiente'})}})()}});
document.addEventListener('change',e=>{const i=e.target.id,v=e.target.value;if(i=='fa'){S.fa=v}else if(i=='fp'){S.fp=+v}else if(i=='fs'){S.fs=v}else if(i=='c1'){S.cost.h=+v||0}else if(i=='c2'){S.cost.e=+v||0}else if(i=='c3'){S.cost.m=+v||0}else return;S.pg=0;paint()});
document.addEventListener('input',e=>{if(e.target.id=='q'){S.q=e.target.value;S.pg=0;paint()}});
document.addEventListener('submit',e=>{e.preventDefault();const em=$('#em').value.trim().toLowerCase(),pw=$('#pw').value,mf=$('#mf').value.trim();if(S.lock)return;if(USERS[em]&&pw=='senha123'&&mf=='54321'){S.u=USERS[em];S.tab='dash';S.fails=0;S.msg='';shell();paint();return}S.fails++;S.lock=S.fails>=3;S.msg=S.lock?'Acesso bloqueado após 3 tentativas falhas.':USERS[em]&&pw=='senha123'?'Código MFA inválido.':'E-mail ou senha incorretos.';shell()});
mkAssets();S.assets.forEach(ev);seedAl();shell();setInterval(()=>{if(S.run&&S.u)tick()},1000);
</script></body></html>
